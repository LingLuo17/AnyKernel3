name: 内核构建 - Android 15 (6.6)

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      kernelsu_variant:
        description: "KernelSU 变体"
        required: true
        type: choice
        options:
          - SukiSU
          - BakaSU
          - FinaSU
        default: FinaSU
      build_channel:
        description: "构建通道（正式=官方 Release 发行版，最新=上游最新提交）"
        required: false
        type: choice
        options:
          - "正式 (Release)"
          - "最新 (HEAD)"
        default: "正式 (Release)"
      version:
        description: "自定义版本名 (可选)"
        required: false
        type: string
      build_time:
        description: "自定义构建时间 (留空=自动获取当前北京时间) (示例 Tue Dec  1 08:10:00 UTC 2026)"
        required: false
        type: string
        default: ""
      use_kpm:
        description: "KPM 功能（仅SukiSU支持，开启未修补）"
        required: true
        type: boolean
        default: false
      droidspaces:
        description: "Droidspaces 容器支持"
        required: false
        type: choice
        options:
          - "off"
          - "678"
          - "123"
          - "345"
        default: "off"
      artifact_upload_mode:
        description: "构建产物上传模式"
        required: true
        type: choice
        options:
          - "仅上传 AnyKernel3.zip"
          - "上传全部"
        default: "仅上传 AnyKernel3.zip"
      droidspaces_ntsync:
        description: "启用 Droidspaces 容器 NTSync 支持（需启用 Droidspaces）"
        required: false
        type: boolean
        default: false
      use_zram:
        description: "启用 ZRAM 压缩算法"
        required: true
        type: boolean
        default: false
      use_bbg:
        description: "启用 BBG 基带保护"
        required: true
        type: boolean
        default: false
      use_net_enhance:
        description: "启用 网络增强 (BBRv3 + IPSet + Qdisc + CIFS)"
        required: true
        type: boolean
        default: false
      use_rekernel:
        description: "启用 Re-Kernel 驱动"
        required: false
        type: boolean
        default: false
      use_nomount:
        description: "启用 NoMount 挂载元模块（需自行刷入配套模块）"
        required: false
        type: boolean
        default: false
      cve_2026_43499_patch:
        description: "应用 CVE-2026-43499 rtmutex 修复链"
        required: false
        type: boolean
        default: false
      cancel_susfs:
        description: "禁用 SUSFS"
        required: true
        type: boolean
        default: false
      supp_op:
        description: "启用 一加 骁龙8 Elite/Gen5 支持"
        required: false
        type: boolean
        default: false
      skip_incompatible:
        description: "功能不兼容或无法使用时自动跳过该功能（不中断构建）"
        required: false
        type: boolean
        default: true
  workflow_call:
    inputs:
      kernelsu_variant:
        required: true
        type: string
      build_channel:
        description: "构建通道（从 main.yml 传入；直接触发时取本工作流拉取的管理器来源）"
        required: false
        type: string
        default: "正式 (Release)"
      version:
        required: false
        type: string
      build_time:
        required: false
        type: string
        default: ""
      use_zram:
        required: true
        type: boolean
      use_bbg:
        required: true
        type: boolean
      use_net_enhance:
        required: true
        type: boolean
        default: false
      use_kpm:
        required: false
        type: boolean
        default: false
      use_rekernel:
        required: false
        type: boolean
        default: false
      use_nomount:
        required: false
        type: boolean
        default: false
      cve_2026_43499_patch:
        required: false
        type: boolean
        default: false
      cancel_susfs:
        required: false
        type: boolean
      supp_op:
        required: false
        type: boolean
      droidspaces:
        required: false
        type: string
        default: "off"
      artifact_upload_mode:
        required: false
        type: string
        default: "上传全部"
      droidspaces_ntsync:
        required: false
        type: boolean
        default: false
      skip_incompatible:
        required: false
        type: boolean
        default: true
      called_from_main:
        description: "是否从 main.yml 调用（内部使用）"
        required: false
        type: boolean
        default: false
      ksu_commit:
        description: "官方最新上传构建的 KernelSU 提交（从 main.yml 传入；直接触发时自动取本工作流拉取的管理器构建）"
        required: false
        type: string
        default: ""

      ksu_cert_size:
        description: "FinaSU 管理器签名证书 DER 尺寸（从 main.yml 传入；直接触发时自动取本工作流拉取的管理器证书）"
        required: false
        type: string
        default: ""

      ksu_cert_hash:
        description: "FinaSU 管理器签名证书 SHA256（从 main.yml 传入；直接触发时自动取本工作流拉取的管理器证书）"
        required: false
        type: string
        default: ""

jobs:
  build-kernels-a15-6-6:
    name: "6.6.${{ matrix.display_sub || matrix.sub_level }}-${{ matrix.os_patch_level }}"
    needs: get-ksu-manager
    # 管理器作业被跳过（called_from_main）或失败时不阻塞构建；ksuCommit 为空时回退传入值或 main HEAD
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - sub_level: "50"
            os_patch_level: "2024-10"
          - sub_level: "56"
            os_patch_level: "2024-11"
          - sub_level: "57"
            os_patch_level: "2024-12"
          - sub_level: "58"
            os_patch_level: "2025-01"
          - sub_level: "66"
            os_patch_level: "2025-02"
          - sub_level: "77"
            os_patch_level: "2025-03"
          - sub_level: "82"
            os_patch_level: "2025-04"
          - sub_level: "87"
            os_patch_level: "2025-05"
          - sub_level: "89"
            os_patch_level: "2025-06"
          - sub_level: "92"
            os_patch_level: "2025-07"
          - sub_level: "98"
            os_patch_level: "2025-09"
          - sub_level: "102"
            os_patch_level: "2025-10"
          - sub_level: "118"
            os_patch_level: "2026-01"
          - sub_level: "127"
            os_patch_level: "2026-04"
          - sub_level: "139"
            os_patch_level: "2026-07"
          - sub_level: "143"
            os_patch_level: "2026-10"
          - sub_level: "X"
            os_patch_level: "lts"
            display_sub: "144"
    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      android_version: "android15"
      kernel_version: "6.6"
      sub_level: ${{ matrix.sub_level }}
      display_sub: ${{ matrix.display_sub || '' }}
      os_patch_level: ${{ matrix.os_patch_level }}
      ksu_variant: ${{ inputs.kernelsu_variant }}
      build_channel: ${{ inputs.build_channel }}
      ksu_commit: ${{ inputs.ksu_commit || needs.get-ksu-manager.outputs.ksuCommit }}
      ksu_cert_size: ${{ inputs.ksu_cert_size || needs.get-ksu-manager.outputs.managerCertSize }}
      ksu_cert_hash: ${{ inputs.ksu_cert_hash || needs.get-ksu-manager.outputs.managerCertHash }}
      version: ${{ inputs.version || '' }}
      build_time: ${{ inputs.build_time || '' }}
      use_zram: ${{ inputs.use_zram }}
      use_bbg: ${{ inputs.use_bbg }}
      use_net_enhance: ${{ inputs.use_net_enhance }}
      use_kpm: ${{ inputs.use_kpm || false }}
      use_rekernel: ${{ inputs.use_rekernel || false }}
      use_nomount: ${{ inputs.use_nomount || false }}
      cve_2026_43499_patch: ${{ inputs.cve_2026_43499_patch }}
      supp_op: ${{ inputs.supp_op || false }}
      enable_susfs: ${{ !inputs.cancel_susfs }}
      droidspaces: ${{ inputs.droidspaces || 'off' }}
      droidspaces_ntsync: ${{ inputs.droidspaces_ntsync || false }}
      artifact_upload_mode: ${{ inputs.artifact_upload_mode }}
      skip_incompatible: ${{ inputs.skip_incompatible || false }}

  # 仅在直接触发时运行，从 main.yml 调用时跳过
  get-ksu-manager:
    if: ${{ !inputs.called_from_main }}
    uses: ./.github/workflows/get-manager.yml
    secrets: inherit
    with:
      kernelsu_variant: ${{ inputs.kernelsu_variant }}
      build_channel: ${{ inputs.build_channel }}
      cancel_susfs: ${{ inputs.cancel_susfs }}
      use_nomount: ${{ inputs.use_nomount || false }}
      use_zram: ${{ inputs.use_zram }}
      use_bbg: ${{ inputs.use_bbg }}
      use_net_enhance: ${{ inputs.use_net_enhance }}
      use_rekernel: ${{ inputs.use_rekernel }}
      use_kpm: ${{ inputs.use_kpm }}
      cve_2026_43499_patch: ${{ inputs.cve_2026_43499_patch }}
      skip_incompatible: ${{ inputs.skip_incompatible || false }}
      droidspaces: ${{ inputs.droidspaces || 'off' }}
      droidspaces_ntsync: ${{ inputs.droidspaces_ntsync || false }}
      artifact_upload_mode: ${{ inputs.artifact_upload_mode }}
      version: ${{ inputs.version || '' }}
      build_time: ${{ inputs.build_time || '' }}
