        required: true
        type: boolean
        default: false
      use_bbg:
        description: "启用 BBG 基带保护"
        required: true
        type: boolean
        default: false
      use_net_enhance:
        description: "启用 网络增强 (BBRv3 + IPSet + Qdisc + CIFS)"
        required: true
        type: boolean
        default: false
      use_rekernel:
        description: "启用 Re-Kernel 驱动"
        required: false
        type: boolean
        default: false
      use_nomount:
        description: "启用 NoMount 挂载元模块（需自行刷入配套模块）"
        required: false
        type: boolean
        default: false
      cve_2026_43499_patch:
        description: "应用 CVE-2026-43499 rtmutex 修复链"
        required: false
        type: boolean
        default: false
      cancel_susfs:
        description: "禁用 SUSFS"
        required: true
        type: boolean
        default: false
      supp_op:
        description: "启用 一加 骁龙8 Elite/Gen5 支持"
        required: false
        type: boolean
        default: false
      skip_incompatible:
        description: "功能不兼容或无法使用时自动跳过该功能（不中断构建）"
        required: false
        type: boolean
        default: true

jobs:
  resolve-version:
    runs-on: ubuntu-24.04
    outputs:
      android_version: ${{ steps.resolve.outputs.android_version }}
      sub_level: ${{ steps.resolve.outputs.sub_level }}
      kernel_full: ${{ steps.resolve.outputs.kernel_full }}
      os_patch_level: ${{ steps.resolve.outputs.os_patch_level }}
    steps:
      - name: 检出版本数据
        uses: actions/checkout@v7

      - name: 解析安全补丁级别
        id: resolve
        env:
          KERNEL_VERSION: ${{ inputs.kernel_version }}
          SUB_LEVEL_A12_5_10: ${{ inputs.sub_level_a12_5_10 }}
          SUB_LEVEL_A13_5_10: ${{ inputs.sub_level_a13_5_10 }}
          SUB_LEVEL_A13_5_15: ${{ inputs.sub_level_a13_5_15 }}
          SUB_LEVEL_A14_5_15: ${{ inputs.sub_level_a14_5_15 }}
          SUB_LEVEL_A14_6_1: ${{ inputs.sub_level_a14_6_1 }}
          SUB_LEVEL_A15_6_6: ${{ inputs.sub_level_a15_6_6 }}
          SUB_LEVEL_A16_6_12: ${{ inputs.sub_level_a16_6_12 }}
          SUB_LEVEL_A17_6_18: ${{ inputs.sub_level_a17_6_18 }}
        run: |
          python3 <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          kernel_version = os.environ["KERNEL_VERSION"]
          android_map = {
              "5.10": "android12",
              "5.15": "android13",
              "6.1": "android14",
              "6.6": "android15",
              "6.12": "android16",
              "6.18": "android17",
          }
          # 同一内核版本可能有多个 Android 版本（android13-5.10、android14-5.15 等），
          # 由对应组合的子版本下拉决定：选中非 auto 项即按该 Android 版本构建，
          # 全部保持 auto 时使用默认映射。
          android_candidates = {
              "5.10": ["android12", "android13"],
              "5.15": ["android13", "android14"],
              "6.1": ["android14"],
              "6.6": ["android15"],
              "6.12": ["android16"],
              "6.18": ["android17"],
          }
          candidates = android_candidates.get(kernel_version)
          if not candidates:
              print(f"::error::未适配的内核版本: {kernel_version}")
              sys.exit(1)

          def sub_level_key(android):
              return "SUB_LEVEL_A%s_%s" % (
                  android.replace("android", ""), kernel_version.replace(".", "_"))

          selected = []
          for android in candidates:
              value = os.environ.get(sub_level_key(android), "").strip()
              if value and not value.startswith("auto"):
                  selected.append((android, value))

          if len(selected) > 1:
              print("::warning::同时选择了多个 Android 版本的子版本: "
                    + ", ".join("%s=%s" % item for item in selected)
                    + f"，使用 {selected[0][0]}")
          if selected:
              android_version, sub_level_input = selected[0]
          else:
              android_version = android_map[kernel_version]
              sub_level_input = os.environ.get(sub_level_key(android_version), "").strip()
              if not sub_level_input:
                  print(f"::warning::{sub_level_key(android_version)} 未设置，回退到 auto")

          data_path = Path("data") / android_version / f"{kernel_version}.json"

          if not data_path.exists():
              print(f"::error::未找到版本数据: {data_path}")
              sys.exit(1)

          with data_path.open("r", encoding="utf-8") as f:
              data = json.load(f)

          # 按子版本反查安全补丁级别（sub_level_input 已按上面的 Android 候选确定）
          if sub_level_input and not sub_level_input.startswith("auto"):
              # 按子版本反查安全补丁级别，如 "138 (2025-06)" -> 2025-06
              token = sub_level_input.split()[0]
              if token == "lts":
                  kernel_full = data.get("lts")
                  if not kernel_full:
                      print(f"::error::{android_version} / {kernel_version} 缺少 LTS 版本数据")
                      sys.exit(1)
                  sub_level = "X"
                  patch_level = "lts"
              elif token.isdigit():
                  matches = [
                      entry for entry in data.get("entries", [])
                      if entry.get("kernel") == f"{kernel_version}.{token}"
                  ]
                  if not matches:
                      # 同一内核版本跨多个 Android 版本时，下拉列表可能不含当前组合的
                      # 子版本；回退到该组合的最新月度条目，避免硬失败
                      entries = data.get("entries", [])
                      if not entries:
                          print(f"::error::{android_version} / {kernel_version} 没有可用的版本数据")
                          sys.exit(1)
                      latest = entries[-1]
                      kernel_full = latest.get("kernel", "")
                      patch_level = latest.get("date", "")
                      sub_level = kernel_full.rsplit(".", 1)[-1]
                      print(f"::warning::{android_version} / {kernel_version}.{token} 无对应数据，回退到 {kernel_full} ({patch_level})")
                  else:
                      # entries 按日期升序，取该子版本对应的最新安全补丁级别
                      latest = matches[-1]
                      kernel_full = latest.get("kernel", "")
                      patch_level = latest.get("date", "")
                      sub_level = token
              else:
                  print(f"::error::无法识别的子版本: {sub_level_input}")
                  sys.exit(1)
          else:
              # auto：取版本数据中最新的月度 ASB 条目（数据由 update_data.py 持续刷新）
              entries = data.get("entries", [])
              if not entries:
                  print(f"::error::{android_version} / {kernel_version} 没有可用的版本数据")
                  sys.exit(1)
              latest = entries[-1]
              kernel_full = latest.get("kernel", "")
              prefix = f"{kernel_version}."
              if not kernel_full.startswith(prefix):
                  print(f"::error::版本数据异常: {kernel_full} 不属于 {kernel_version}")
                  sys.exit(1)
              patch_level = latest.get("date", "")
              sub_level = kernel_full.rsplit(".", 1)[-1]

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"android_version={android_version}\n")
              output.write(f"sub_level={sub_level}\n")
              output.write(f"kernel_full={kernel_full}\n")
              output.write(f"os_patch_level={patch_level}\n")

          print(f"解析结果: {android_version} / {kernel_full} / 补丁级别 {patch_level}，子版本号: {sub_level}")
          PY

  build-custom-kernel:
    name: "${{ needs.resolve-version.outputs.kernel_full }}-${{ needs.resolve-version.outputs.android_version }}-${{ needs.resolve-version.outputs.os_patch_level }}"
    needs: [resolve-version, get-ksu-manager]
    # 管理器拉取失败时不阻塞内核构建（ksuCommit 为空则内核跟随 main HEAD）
    if: ${{ !cancelled() && needs.resolve-version.result == 'success' }}
    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      android_version: ${{ needs.resolve-version.outputs.android_version }}
      kernel_version: ${{ inputs.kernel_version }}
      sub_level: ${{ needs.resolve-version.outputs.sub_level }}
      os_patch_level: ${{ needs.resolve-version.outputs.os_patch_level }}
      revision: "r1"
      ksu_variant: ${{ inputs.kernelsu_variant }}
      build_channel: ${{ inputs.build_channel }}
      # 内核侧 KernelSU 检出到官方最新上传 Manager 构建的同一提交，
      # 使内核 KSU 版本与拉取的管理器安装包严格一致（BakaSU / FinaSU 生效）
      ksu_commit: ${{ needs.get-ksu-manager.outputs.ksuCommit }}
      ksu_cert_size: ${{ needs.get-ksu-manager.outputs.managerCertSize }}
      ksu_cert_hash: ${{ needs.get-ksu-manager.outputs.managerCertHash }}
      version: ${{ inputs.version || '' }}
      build_time: ${{ inputs.build_time || '' }}
      use_zram: ${{ inputs.use_zram }}
      use_bbg: ${{ inputs.use_bbg }}
      use_net_enhance: ${{ inputs.use_net_enhance }}
      use_kpm: ${{ inputs.use_kpm || false }}
      use_rekernel: ${{ inputs.use_rekernel || false }}
      use_nomount: ${{ inputs.use_nomount || false }}
      cve_2026_43499_patch: ${{ inputs.cve_2026_43499_patch }}
      supp_op: ${{ inputs.supp_op || false }}
      enable_susfs: ${{ !inputs.cancel_susfs }}
      droidspaces: ${{ startsWith(inputs.droidspaces, '678') && '678' || startsWith(inputs.droidspaces, '123') && '123' || startsWith(inputs.droidspaces, '345') && '345' || 'off' }}
      droidspaces_ntsync: ${{ contains(inputs.droidspaces, 'NTSync') }}
      artifact_upload_mode: ${{ inputs.artifact_upload_mode }}
      skip_incompatible: ${{ inputs.skip_incompatible || false }}

  # 先拉取官方最新上传的 Manager 构建并输出其提交 SHA，供内核构建对齐
  get-ksu-manager:
    uses: ./.github/workflows/get-manager.yml
    secrets: inherit
    with:
      kernelsu_variant: ${{ inputs.kernelsu_variant }}
      build_channel: ${{ inputs.build_channel }}
      cancel_susfs: ${{ inputs.cancel_susfs }}
      use_nomount: ${{ inputs.use_nomount || false }}
